<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#29483d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="古琴实时麦克风调音器，支持六种传统古琴调式、整体升降半音与低频防八度识别">
  <title>古琴调音器</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1 id="appTitle">古琴调音器</h1>
      </div>
      <div class="topbar-actions">
        <button id="installBtn" class="pill-btn subtle" type="button" hidden>安装到桌面</button>
        <button id="langBtn" class="pill-btn subtle" type="button" aria-label="切换为繁体中文">繁</button>
        <button id="micBtn" class="pill-btn primary" type="button" aria-pressed="false">
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="micBtnText">开始调音</span>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="workspace">
      <div class="left-pane">
        <section class="meter-card" aria-live="polite">
          <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 240 142" role="img" aria-label="音分偏差指针表盘">
              <!-- 背景半圆弧 -->
              <path class="gauge-track" d="M 24 126 A 96 96 0 0 1 216 126" />
              <!-- 准音绿区弧 (-10 ~ +10 音分，约 ±18 度) -->
              <path class="gauge-ok-arc" d="M 90.3 34.7 A 96 96 0 0 1 149.7 34.7" />
              <!-- 刻度与文字 -->
              <g id="gaugeTicks"></g>
              <text class="gauge-label" x="24" y="139" text-anchor="middle">-50</text>
              <text class="gauge-label" x="97" y="62" text-anchor="middle">-10</text>
              <text class="gauge-label zero" x="120" y="56" text-anchor="middle">0</text>
              <text class="gauge-label" x="143" y="62" text-anchor="middle">+10</text>
              <text class="gauge-label" x="216" y="139" text-anchor="middle">+50</text>
              <!-- 指针 -->
              <g id="needleGroup" class="needle-group" transform="rotate(0 120 126)">
                <polygon class="needle-body" points="120,38 115.5,122 124.5,122" />
                <circle class="needle-pivot" cx="120" cy="126" r="7" />
              </g>
            </svg>
          </div>

          <div class="readout">
            <div class="note-display" id="noteDisplay">
              <span class="note-letter" id="noteLetter">--</span>
              <span class="note-meta">
                <span class="note-acc" id="noteAccidental"></span>
                <span class="note-oct" id="noteOctave"></span>
              </span>
            </div>
            <div class="freq-value" id="freqDisplay">--.- Hz</div>
          </div>
        </section>

        <div class="a4-bar">
          <button id="a4Dec" class="round-ctrl" type="button" aria-label="降低 A4 基准">−</button>
          <button id="a4Value" class="a4-readout" type="button" title="点击重置为 440 Hz">440 Hz</button>
          <button id="a4Inc" class="round-ctrl" type="button" aria-label="升高 A4 基准">+</button>
        </div>

        <div class="bamboo-stage" aria-hidden="true">
          <svg class="bamboo-svg" viewBox="0 0 220 160" fill="none">
            <path d="M22 156 C 46 112, 62 72, 74 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.22"/>
            <path d="M74 66 C 98 58, 128 56, 152 64 C 126 70, 98 73, 74 66 Z" fill="currentColor" opacity="0.14"/>
            <path d="M62 96 C 92 84, 128 78, 166 86 C 134 97, 94 103, 62 96 Z" fill="currentColor" opacity="0.16"/>
            <path d="M52 124 C 84 114, 118 115, 146 126 C 114 132, 82 132, 52 124 Z" fill="currentColor" opacity="0.12"/>
            <path d="M46 72 C 28 56, 16 42, 8 26 C 26 38, 40 52, 46 72 Z" fill="currentColor" opacity="0.13"/>
            <path d="M126 38 C 148 26, 174 22, 198 28 C 174 37, 150 42, 126 38 Z" fill="currentColor" opacity="0.11"/>
          </svg>
        </div>

        <div class="bottom-controls">
          <div class="transpose-row">
            <button id="transposeDown" class="transpose-btn" type="button">降半音</button>
            <button id="transposeUp" class="transpose-btn" type="button">升半音</button>
          </div>

          <div class="tuning-card" id="tuningCard" role="button" tabindex="0" aria-haspopup="dialog">
            <div class="tuning-card-head">
              <div class="tuning-title-wrap">
                <span id="tuningTitle" class="tuning-title">正调定弦 1=F</span>
                <span id="switchTuningHint" class="tuning-hint">点击切换调式 ▾</span>
              </div>
              <button id="transposeBadge" class="transpose-badge" type="button" hidden title="点击移调归零">-1</button>
            </div>
            <div id="jianpuRow" class="jianpu-row" aria-label="七弦散音简谱"></div>
          </div>
        </div>
      </div>

      <aside class="strings-pane" aria-label="古琴七弦指示">
        <div id="stringsColumn" class="strings-column"></div>
      </aside>
    </main>

    <!-- 底部没骨水墨山水抚琴底图（小屏竖向意象 / 大屏烟波宽卷） -->
    <div class="ink-wash-bg" aria-hidden="true">
      <picture class="ink-bg-picture">
        <source media="(min-width: 820px)" srcset="assets/ink-bg-desktop.webp" type="image/webp">
        <img class="ink-bg-img" src="assets/ink-bg-mobile.webp" alt="" decoding="async">
      </picture>
    </div>
  </div>

  <!-- 调式选择底部抽屉 -->
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <section id="tuningDrawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-header">
      <h2 id="drawerTitle">选择古琴调式</h2>
      <button id="drawerClose" class="drawer-close" type="button">关闭</button>
    </div>
    <div id="tuningList" class="tuning-list"></div>
  </section>

  <!-- 隐藏彩蛋：关于弹窗（连击标题 5 次触发） -->
  <div id="aboutBackdrop" class="drawer-backdrop" hidden></div>
  <section id="aboutModal" class="drawer about-modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
    <div class="drawer-header">
      <h2 id="aboutTitle">关于</h2>
      <button id="aboutClose" class="drawer-close" type="button">关闭</button>
    </div>
    <div class="about-body">
      <div class="about-hero">
        <div class="about-name-row">
          <span id="aboutAppName" class="about-app-name">古琴调音器</span>
        </div>
        <div id="aboutSubtitle" class="about-subtitle">离线古琴实时调音工具</div>
        <div class="about-meta-grid">
          <div class="about-meta-item">
            <span id="aboutAuthorLabel" class="about-meta-label">作者</span>
            <span id="aboutAuthorValue" class="about-meta-value">朝雨</span>
          </div>
          <div class="about-meta-item">
            <span id="aboutVersionLabel" class="about-meta-label">版本</span>
            <span id="aboutVersionValue" class="about-meta-value">v1.1.0</span>
          </div>
        </div>
        <div class="about-thanks-row">
          <span id="aboutThanksLabel" class="about-meta-label">致谢</span>
          <span id="aboutThanksValue" class="about-thanks-value">感谢子潇提供的底图</span>
        </div>
      </div>
      <div class="about-changelog-wrap">
        <h3 id="aboutChangelogTitle" class="about-section-title">更新日志</h3>
        <div id="aboutChangelog" class="about-changelog"></div>
      </div>
    </div>
  </section>

  <script type="module" src="src/app.js"></script>
</body>
</html>
