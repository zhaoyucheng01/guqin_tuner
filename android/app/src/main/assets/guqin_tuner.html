  <title>古琴调音器</title>

  <style>
:root {
  --bg: #f4f2ec;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

}
button { font: inherit; color: inherit; cursor: pointer; }
.app-shell {
  position: relative;

.topbar, .banner, .workspace { position: relative; z-index: 1; }

.ink-bg-picture { display: block; width: 100%; }
.ink-bg-img { display: block; width: 100%; height: auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; margin-bottom: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 750; letter-spacing: 0.04em; user-select: none; -webkit-user-select: none; }
.topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.pill-btn {
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px;
  font-size: 13px; font-weight: 600; background: var(--paper);
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;

}
.pill-btn:active { transform: scale(0.97); }

.pill-btn.primary.listening { background: var(--tune-ok); border-color: var(--tune-ok); }
.mic-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }

.gauge-wrap { width: 100%; display: flex; align-items: center; justify-content: center; }
.gauge-svg { width: 100%; max-width: 224px; height: auto; overflow: visible; }
.gauge-track { fill: none; stroke: #d7ddd9; stroke-width: 5.5; stroke-linecap: round; }

.needle-body, .needle-pivot { fill: var(--green); transition: fill 0.16s ease; }

.needle-group.sharp .needle-body, .needle-group.sharp .needle-pivot { fill: var(--sharp); }
.needle-group.flat .needle-body, .needle-group.flat .needle-pivot { fill: var(--flat); }
.workspace { margin: 0; display: grid; grid-template-columns: 1fr 90px; gap: 15px; align-items: stretch; }
.left-pane { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0; }
.bottom-controls { display: contents; }
.a4-bar {
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow);
}
.round-ctrl {

}

.round-ctrl:disabled { opacity: 0.35; cursor: not-allowed; }
.a4-readout {

}
.a4-readout:active { background: var(--green-soft); }
.bamboo-stage { display: none; }
.bamboo-svg { width: 92%; max-height: 155px; color: var(--green); }
.transpose-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.transpose-btn {
  border: 1px solid #cad6ce; border-radius: 999px; background: var(--green-soft); color: var(--green);
  padding: 10px 8px; font-size: 14px; font-weight: 700;

}
.transpose-btn:active { transform: scale(0.97); background: #dce8e0; }

.tuning-card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 12px 14px; box-shadow: var(--shadow); position: relative;
  overflow: hidden; cursor: pointer; transition: border-color 0.15s ease;
}
.tuning-card:active { border-color: var(--gold); }
.tuning-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.tuning-title-wrap { display: flex; flex-direction: column; gap: 2px; }
.tuning-title { font-size: 15px; font-weight: 750; color: var(--ink); }
.tuning-hint { font-size: 11px; color: var(--muted); }
.transpose-badge {
  position: absolute; top: 0; right: 0; border: 0; background: var(--gold); color: #fff;
  font-size: 14px; font-weight: 750; padding: 5px 14px 6px 16px;
  border-bottom-left-radius: 14px; font-variant-numeric: tabular-nums;
}
.jianpu-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; align-items: start; gap: 2px; }
.jianpu-cell { display: flex; flex-direction: column; align-items: center; color: var(--green); transition: color 0.15s ease, transform 0.15s ease; }
.jianpu-cell.active { color: var(--gold); transform: translateY(-1px); }
.jianpu-cell.in-tune { color: var(--tune-ok); }
.jianpu-digit { font-size: 19px; font-weight: 750; line-height: 1.1; }
.jianpu-dots { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; min-height: 10px; }
.jianpu-dot { width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor; }
.strings-pane { display: flex; flex-direction: column; justify-content: space-between; }
.strings-column { height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; padding: 2px 0; }
.string-row { display: flex; align-items: center; justify-content: flex-end; gap: 11px; position: relative; }
.string-peg {
  width: 52px; height: 52px; border-radius: 50%; background: var(--paper);
  border: 1.5px solid #cfd6cf; box-shadow: inset 0 0 0 2px #f4f2ec, 0 2px 8px rgba(38, 51, 46, 0.06);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform 0.16s ease, border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
}
.string-note { font-size: 15.5px; font-weight: 750; line-height: 1.05; color: var(--green); }
.string-num { font-size: 10px; color: var(--muted); line-height: 1.1; }
.string-hz { display: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.string-row.active .string-peg { border-color: var(--gold); background: var(--gold-soft); transform: scale(1.07); box-shadow: inset 0 0 0 2px #fff, 0 0 0 4px rgba(162, 124, 62, 0.18); }
.string-row.active .string-note { color: #7d5b22; }
.string-row.in-tune .string-peg { border-color: var(--tune-ok); background: var(--tune-ok-soft); transform: scale(1.09); box-shadow: inset 0 0 0 2px #fff, 0 0 0 4px rgba(46, 125, 91, 0.22); }
.string-row.in-tune .string-note { color: var(--tune-ok); }
.string-dots-track { width: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.track-dot { width: 6.5px; height: 6.5px; border-radius: 50%; background: #d2dad5; transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
.track-dot.dot-ok { width: 9px; height: 9px; background: #b5c3bc; }
.track-dot.dot-low.lit { background: var(--flat); transform: scale(1.2); box-shadow: 0 0 0 3px rgba(77, 112, 138, 0.22); }
.track-dot.dot-ok.lit { background: var(--tune-ok); transform: scale(1.18); box-shadow: 0 0 0 3px rgba(46, 125, 91, 0.24); }
.track-dot.dot-high.lit { background: var(--cinnabar); transform: scale(1.2); box-shadow: 0 0 0 3px rgba(194, 75, 58, 0.22); }
.drawer-backdrop { position: fixed; inset: 0; background: rgba(25, 36, 32, 0.42); z-index: 20; }
.drawer {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(460px, 100%); max-height: 78dvh; background: var(--paper);
  border-top-left-radius: 22px; border-top-right-radius: 22px;
  padding: 16px 16px max(18px, env(safe-area-inset-bottom));

}
.drawer-header { display: flex; align-items: center; justify-content: space-between; }
.drawer-header h2 { margin: 0; font-size: 16px; font-weight: 750; }
.drawer-close { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; }
.tuning-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.tuning-option { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 11px 13px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.tuning-option.selected { border-color: var(--green); background: var(--green-soft); }
.tuning-option-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tuning-option-name { font-size: 15px; font-weight: 750; color: var(--ink); }
.tuning-option-key { font-size: 12px; font-weight: 700; color: var(--green); background: rgba(41, 72, 61, 0.1); border-radius: 999px; padding: 2px 8px; }
.tuning-option-meta { font-size: 12px; color: var(--muted); }
.tuning-option-notes { font-size: 12px; font-weight: 600; color: var(--gold); letter-spacing: 0.04em; }
.about-body { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-right: 2px; }

.about-subtitle { font-size: 13px; color: var(--muted); }

.about-meta-item { display: flex; flex-direction: column; gap: 2px; }

.about-thanks-row, .about-repo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; border-top: 1px dashed rgba(228, 224, 213, 0.9); }

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1 id="appTitle">古琴调音器</h1>
      </div>
      <div class="topbar-actions">
        <button id="installBtn" class="pill-btn subtle" type="button" hidden>安装到桌面</button>
        <button id="langBtn" class="pill-btn subtle" type="button" aria-label="切换为繁体中文">繁</button>
        <button id="micBtn" class="pill-btn primary" type="button" aria-pressed="false">
          <span class="mic-dot" aria-hidden="true"></span>
          <span id="micBtnText">开始调音</span>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="workspace">
      <div class="left-pane">
        <section class="meter-card" aria-live="polite">
          <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 240 142" role="img" aria-label="音分偏差指针表盘">
              <path class="gauge-track" d="M 24 126 A 96 96 0 0 1 216 126" />
              <path class="gauge-ok-arc" d="M 90.3 34.7 A 96 96 0 0 1 149.7 34.7" />
              <g id="gaugeTicks"></g>
              <text class="gauge-label" x="24" y="139" text-anchor="middle">-50</text>
              <text class="gauge-label" x="97" y="62" text-anchor="middle">-10</text>
              <text class="gauge-label zero" x="120" y="56" text-anchor="middle">0</text>
              <text class="gauge-label" x="143" y="62" text-anchor="middle">+10</text>

    function formatMidiNote(midi, preferFlat = true) {
      const rounded = Math.round(midi);
      const pc = ((rounded % 12) + 12) % 12;
      const octave = Math.floor(rounded / 12) - 1;
      const [letter, accidental] = (preferFlat ? FLAT_NOTES : SHARP_NOTES)[pc];
      return { letter, accidental, octave, shortName: `${letter}${accidental}`, fullName: `${letter}${accidental}${octave}` };
    }

    function getEffectiveStrings(tuningId, transpose = 0, a4 = A4_DEFAULT) {
      const tuning = getTuningById(tuningId);
      const shift = clamp(Math.round(transpose), TRANSPOSE_MIN, TRANSPOSE_MAX);
      const refA4 = clamp(a4, A4_MIN, A4_MAX);
      return tuning.baseMidis.map((baseMidi, index) => {
        const midi = baseMidi + shift;
        const nextMidi = index < 6 ? tuning.baseMidis[index + 1] + shift : null;
        return {
          index, stringNumber: index + 1, midi, freq: midiToFreq(midi, refA4),
          note: formatMidiNote(midi, tuning.preferFlat), jianpu: tuning.jianpu[index],
          gapToNext: nextMidi === null ? 0 : Math.max(0, nextMidi - midi)

      });
    }

    function analyzePitch(freq, { tuningId = DEFAULT_TUNING_ID, transpose = 0, a4 = A4_DEFAULT } = {}) {
      if (!Number.isFinite(freq) || freq <= 0) return null;
      const tuning = getTuningById(tuningId);
      const refA4 = clamp(a4, A4_MIN, A4_MAX);
      const midi = freqToMidi(freq, refA4);
      const nearestMidi = Math.round(midi);
      const cents = (midi - nearestMidi) * 100;
      const note = formatMidiNote(nearestMidi, tuning.preferFlat);
      const strings = getEffectiveStrings(tuning.id, transpose, refA4);
      let minDiff = Infinity;
      for (const s of strings) { const d = Math.abs(midi - s.midi); if (d < minDiff) minDiff = d; }

        ? strings.filter((s) => Math.abs(Math.abs(midi - s.midi) - minDiff) < 1e-6).map((s) => s.index)
        : [];
      return { freq, midi, nearestMidi, cents, note, inTune: Math.abs(cents) <= IN_TUNE_CENTS, matchedStrings };
    }

    function detectPitchMPM(buffer, sampleRate) {
      const minFreq = 30, maxFreq = 1200, rmsThreshold = 0.008, clarityThreshold = 0.55, peakRatio = 0.88;
      const size = buffer.length;
      if (size < 512 || !sampleRate) return null;
      let mean = 0;
      for (let i = 0; i < size; i++) mean += buffer[i];
      mean /= size;
      let sumSq = 0;
      const x = new Float32Array(size);
      for (let i = 0; i < size; i++) { const v = buffer[i] - mean; x[i] = v; sumSq += v * v; }
      const rms = Math.sqrt(sumSq / size);
      if (rms < rmsThreshold) return null;
      const minLag = Math.max(2, Math.floor(sampleRate / maxFreq));
      const maxLag = Math.min(Math.floor(size / 2), Math.ceil(sampleRate / minFreq));
      if (maxLag <= minLag) return null;
      const prefixSq = new Float64Array(size + 1);
      for (let i = 0; i < size; i++) prefixSq[i + 1] = prefixSq[i] + x[i] * x[i];
      const nsdf = new Float32Array(maxLag + 1);
      for (let tau = minLag; tau <= maxLag; tau++) {
        const limit = size - tau;
        let acf = 0;
        for (let j = 0; j < limit; j++) acf += x[j] * x[j + tau];
        const m = prefixSq[limit] + (prefixSq[size] - prefixSq[tau]);
        nsdf[tau] = m > 1e-12 ? (2 * acf) / m : 0;
      }
      let startTau = minLag;
      while (startTau <= maxLag && nsdf[startTau] > 0) startTau++;
      const peaks = [];
      let inPositive = false, peakIdx = -1, peakVal = -Infinity;
      for (let tau = startTau; tau <= maxLag; tau++) {
        const v = nsdf[tau];
        if (v > 0) {
          if (!inPositive) { inPositive = true; peakIdx = tau; peakVal = v; }
          else if (v > peakVal) { peakIdx = tau; peakVal = v; }
        } else if (inPositive) {
          peaks.push({ lag: peakIdx, val: peakVal });
          inPositive = false; peakIdx = -1; peakVal = -Infinity;
        }
      }
      if (inPositive && peakIdx !== -1) peaks.push({ lag: peakIdx, val: peakVal });
      if (!peaks.length) return null;
      let maxPeak = 0;
      for (const p of peaks) if (p.val > maxPeak) maxPeak = p.val;
      if (maxPeak < clarityThreshold) return null;
      const threshold = maxPeak * peakRatio;
      let chosen = peaks.find((p) => p.val >= threshold) || peaks[0];
      const doubleLag = chosen.lag * 2;
      if (doubleLag <= maxLag) {
        const sub = peaks.find((p) => Math.abs(p.lag - doubleLag) <= Math.max(3, chosen.lag * 0.04) && p.val >= chosen.val * 0.96 && p.val >= 0.85);
        if (sub && sub.val > chosen.val + 0.02) chosen = sub;
      }
      let refinedLag = chosen.lag;
      if (chosen.lag > minLag && chosen.lag < maxLag) {
        const y0 = nsdf[chosen.lag - 1], y1 = nsdf[chosen.lag], y2 = nsdf[chosen.lag + 1];
        const denom = 2 * (2 * y1 - y2 - y0);
        if (Math.abs(denom) > 1e-12) {
          const delta = (y2 - y0) / denom;
          if (Math.abs(delta) < 1) refinedLag = chosen.lag + delta;
        }
      }
      const freq = sampleRate / refinedLag;
      return freq >= minFreq && freq <= maxFreq ? { freq, clarity: chosen.val, rms } : null;
    }

    class PitchSmoother {
      constructor() { this.history = []; this.lastFreq = null; this.lastValidMs = 0; }
      reset() { this.history = []; this.lastFreq = null; this.lastValidMs = 0; }
      push(freq, nowMs) {
        if (!Number.isFinite(freq) || freq <= 0) {
          if (this.lastFreq !== null && nowMs - this.lastValidMs <= 1500) return { freq: this.lastFreq, isHeld: true };
          this.reset(); return null;
        }
        if (this.lastFreq !== null && Math.abs(1200 * Math.log2(freq / this.lastFreq)) > 80) this.history = [];
        this.history.push(freq);
        if (this.history.length > 5) this.history.shift();
        const s = [...this.history].sort((a, b) => a - b);
        const mid = Math.floor(s.length / 2);
        const median = s.length % 2 === 1 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
        this.lastFreq = median; this.lastValidMs = nowMs;
        return { freq: median, isHeld: false };
      }
    }

    class AudioTunerSession {
      constructor() { this.isRunning = false; this.audioCtx = null; this.stream = null; this.analyser = null; this.wakeLock = null; }
      async start() {
        if (this.isRunning) return { sampleRate: this.audioCtx.sampleRate };
        if (!window.isSecureContext) { const e = new Error("INSECURE_CONTEXT"); e.code = "INSECURE_CONTEXT"; throw e; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { const e = new Error("UNSUPPORTED"); e.code = "UNSUPPORTED"; throw e; }
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        } catch (err) {
          if (err && (err.name === "OverconstrainedError" || err.name === "TypeError")) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } else { throw err; }
        }
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        if (ctx.state === "suspended") await ctx.resume();
        const source = ctx.createMediaStreamSource(stream);
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass"; filter.frequency.value = 1000; filter.Q.value = 0.707;
        const analyser = ctx.createAnalyser();
        analyser.fftSize = FFT_SIZE; analyser.smoothingTimeConstant = 0;
        source.connect(filter); filter.connect(analyser);
        this.stream = stream; this.audioCtx = ctx; this.source = source; this.filter = filter; this.analyser = analyser; this.isRunning = true;
        if ("wakeLock" in navigator) { try { this.wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
        return { sampleRate: ctx.sampleRate };
      }
      readTimeDomain(buf) { if (!this.isRunning || !this.analyser) return null; this.analyser.getFloatTimeDomainData(buf); return buf; }
      async stop() {
        this.isRunning = false;
        if (this.wakeLock) { try { await this.wakeLock.release(); } catch {} this.wakeLock = null; }
        if (this.source) { try { this.source.disconnect(); } catch {} }
        if (this.filter) { try { this.filter.disconnect(); } catch {} }
        if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
        if (this.audioCtx) { try { await this.audioCtx.close(); } catch {} }
        this.source = this.filter = this.analyser = this.stream = this.audioCtx = null;
      }
    }

    const state = { tuningId: DEFAULT_TUNING_ID, transpose: 0, a4: A4_DEFAULT, language: "zh-CN", sampleRate: 48000, targetAngle: 0, currentAngle: 0, lastAnalysis: null, lastIsHeld: false, installPrompt: null };

    }

    function renderGaugeTicks() {
      const container = $("gaugeTicks");
      container.innerHTML = "";
      for (let cents = -50; cents <= 50; cents += 5) {
        const isMajor = cents % 10 === 0;
        const rad = ((cents / 50) * 90 * Math.PI) / 180;
        const rInner = isMajor ? 84 : 89;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", (120 + rInner * Math.sin(rad)).toFixed(1));
        line.setAttribute("y1", (126 - rInner * Math.cos(rad)).toFixed(1));
        line.setAttribute("x2", (120 + 96 * Math.sin(rad)).toFixed(1));
        line.setAttribute("y2", (126 - 96 * Math.cos(rad)).toFixed(1));
        line.setAttribute("class", isMajor ? "gauge-tick major" : "gauge-tick");
        container.appendChild(line);
      }
    }

    function renderStrings(analysis = null) {
      const matched = analysis ? analysis.matchedStrings : [];
      const col = $("stringsColumn"); col.innerHTML = "";
      getEffectiveStrings(state.tuningId, state.transpose, state.a4).forEach((s, idx) => {
        const isMatched = matched.includes(idx);
        const deltaCents = isMatched && analysis ? (analysis.midi - s.midi) * 100 : null;
        const isOk = deltaCents !== null && Math.abs(deltaCents) <= IN_TUNE_CENTS;
        const isLow = deltaCents !== null && deltaCents < -IN_TUNE_CENTS;
        const isHigh = deltaCents !== null && deltaCents > IN_TUNE_CENTS;
        const row = document.createElement("div");
        row.className = "string-row" + (isMatched ? (isOk ? " in-tune" : " active") : "");
        const peg = document.createElement("div");
        peg.className = "string-peg";
        peg.innerHTML = `<span class="string-note">${s.note.shortName}</span><span class="string-num">${STRING_NUMERALS[idx]}弦</span>`;
        const hzEl = document.createElement("span");
        hzEl.className = "string-hz";
        hzEl.textContent = `${s.freq.toFixed(1)} Hz`;
        const track = document.createElement("div");
        track.className = "string-dots-track";
        track.innerHTML =
          `<span class="track-dot dot-low${isLow ? " lit" : ""}"></span>` +
          `<span class="track-dot dot-ok${isOk ? " lit" : ""}"></span>` +
          `<span class="track-dot dot-high${isHigh ? " lit" : ""}"></span>`;
        row.appendChild(peg); row.appendChild(hzEl); row.appendChild(track);
        col.appendChild(row);
      });
    }

    function renderTuningCard(matched = [], inTune = false) {
      const dict = getDict(state.language), tuning = getTuningById(state.tuningId), meta = dict.tunings[tuning.id];
      $("tuningTitle").textContent = `${meta.name}${dict.tuningSuffix} ${tuning.keyLabel}`;
      $("switchTuningHint").textContent = `${dict.switchTuningHint} ▾`;
      const badge = $("transposeBadge");
      badge.hidden = state.transpose === 0;
      if (state.transpose !== 0) {
        badge.textContent = state.transpose > 0 ? `+${state.transpose}` : `${state.transpose}`;
        badge.title = dict.resetTransposeTitle;
      }
      const row = $("jianpuRow"); row.innerHTML = "";
      tuning.jianpu.forEach((item, idx) => {
        const cell = document.createElement("div");
        cell.className = "jianpu-cell" + (matched.includes(idx) ? (inTune ? " in-tune" : " active") : "");
        const digit = document.createElement("span"); digit.className = "jianpu-digit"; digit.textContent = item.digit;
        const dots = document.createElement("span"); dots.className = "jianpu-dots";
        for (let i = 0; i < Math.abs(Math.min(0, item.dots)); i++) {
          const dot = document.createElement("span"); dot.className = "jianpu-dot"; dots.appendChild(dot);
        }
        cell.appendChild(digit); cell.appendChild(dots); row.appendChild(cell);
      });
    }

    function renderDrawerList() {
      const dict = getDict(state.language), list = $("tuningList"); list.innerHTML = "";
      TUNINGS.forEach((t) => {
        const info = dict.tunings[t.id];
        const notesText = getEffectiveStrings(t.id, state.transpose, state.a4).map((s) => s.note.shortName).join("  ");
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "tuning-option" + (t.id === state.tuningId ? " selected" : "");
        btn.innerHTML = `<div class="tuning-option-top"><span class="tuning-option-name">${info.name} · ${info.alter}</span><span class="tuning-option-key">${t.keyLabel}</span></div><div class="tuning-option-notes">${notesText}</div><div class="tuning-option-meta">${info.pieces}</div>`;
        btn.addEventListener("click", () => { state.tuningId = t.id; saveSettings(); closeDrawer(); renderStaticUI(); });
        list.appendChild(btn);
      });
    }

    function renderReadout(analysis, isHeld) {
      const noteDisplay = $("noteDisplay"), needle = $("needleGroup");
      if (!analysis) {
        $("noteLetter").textContent = "--"; $("noteAccidental").textContent = ""; $("noteOctave").textContent = "";
        $("freqDisplay").textContent = "--.- Hz"; noteDisplay.className = "note-display";
        needle.setAttribute("class", "needle-group"); state.targetAngle = 0;
        renderStrings(null); renderTuningCard([], false); return;
      }
      $("noteLetter").textContent = analysis.note.letter;
      $("noteAccidental").textContent = analysis.note.accidental;
      $("noteOctave").textContent = String(analysis.note.octave);
      $("freqDisplay").textContent = `${analysis.freq.toFixed(1)} Hz`;
      noteDisplay.className = "note-display" + (analysis.inTune ? " in-tune" : "") + (isHeld ? " is-held" : "");
      if (analysis.inTune) needle.setAttribute("class", "needle-group in-tune");
      else if (analysis.cents < 0) needle.setAttribute("class", "needle-group flat");
      else needle.setAttribute("class", "needle-group sharp");
      state.targetAngle = clamp((analysis.cents / 50) * 90, -90, 90);
      renderStrings(analysis);
      renderTuningCard(analysis.matchedStrings, analysis.inTune);
    }

    function renderStaticUI() {
      const dict = getDict(state.language);
      document.documentElement.lang = state.language; document.title = dict.title;
      $("appTitle").textContent = dict.title; $("langBtn").textContent = dict.langToggle;
      $("langBtn").setAttribute("aria-label", dict.langAria); $("installBtn").textContent = dict.installApp;
      $("micBtnText").textContent = session.isRunning ? dict.stopMic : dict.startMic;
      $("micBtn").classList.toggle("listening", session.isRunning);
      $("micBtn").setAttribute("aria-pressed", String(session.isRunning));
      $("transposeDown").textContent = dict.lowerSemitone; $("transposeUp").textContent = dict.raiseSemitone;
      $("drawerTitle").textContent = dict.drawerTitle; $("drawerClose").textContent = dict.drawerClose;
      $("a4Value").textContent = `${state.a4} Hz`; $("a4Value").title = dict.resetA4Title;
      $("a4Dec").disabled = state.a4 <= A4_MIN; $("a4Inc").disabled = state.a4 >= A4_MAX;
      $("transposeDown").disabled = state.transpose <= TRANSPOSE_MIN; $("transposeUp").disabled = state.transpose >= TRANSPOSE_MAX;
      const m = state.lastAnalysis ? state.lastAnalysis.matchedStrings : [], ok = state.lastAnalysis ? state.lastAnalysis.inTune : false;
      renderStrings(state.lastAnalysis); renderTuningCard(m, ok); renderDrawerList(); renderAboutModal();
    }
    function renderAboutModal() {
      const dict = getDict(state.language), { about } = dict, verText = `v${APP_VERSION}`;
      $("aboutTitle").textContent = about.title; $("aboutClose").textContent = dict.drawerClose;
      $("aboutAppName").textContent = dict.title; $("aboutVersionBadge").textContent = verText;
      $("aboutSubtitle").textContent = about.subtitle; $("aboutAuthorLabel").textContent = about.authorLabel;
      $("aboutAuthorValue").textContent = APP_AUTHOR; $("aboutVersionLabel").textContent = about.versionLabel;
      $("aboutVersionValue").textContent = verText; $("aboutLicenseLabel").textContent = about.licenseLabel;
      $("aboutThanksLabel").textContent = about.thanksLabel; $("aboutThanksValue").textContent = about.thanksText;
      $("aboutRepoLabel").textContent = about.repoLabel; $("aboutChangelogTitle").textContent = about.changelogTitle;
      const box = $("aboutChangelog"); box.innerHTML = "";
      about.changelog.forEach((entry) => {
        const card = document.createElement("div"); card.className = "changelog-entry";
        card.innerHTML = `<div class="changelog-head"><span class="changelog-ver">${entry.version}</span><span class="changelog-date">${entry.date}</span></div><ul class="changelog-list">${entry.items.map((x) => `<li>${x}</li>`).join("")}</ul>`;
        box.appendChild(card);
      });
    }
    function openAboutModal() { renderAboutModal(); $("aboutBackdrop").hidden = false; $("aboutModal").hidden = false; }
    function closeAboutModal() { $("aboutBackdrop").hidden = true; $("aboutModal").hidden = true; }

    const openDrawer = () => { renderDrawerList(); $("drawerBackdrop").hidden = false; $("tuningDrawer").hidden = false; };
    const closeDrawer = () => { $("drawerBackdrop").hidden = true; $("tuningDrawer").hidden = true; };

    function tick() {
      if (!session.isRunning) return;
      const buf = session.readTimeDomain(timeBuffer);
      if (buf) {
        const raw = detectPitchMPM(buf, state.sampleRate);
        const sm = smoother.push(raw ? raw.freq : null, performance.now());
        if (sm) { state.lastAnalysis = analyzePitch(sm.freq, state); state.lastIsHeld = sm.isHeld; }
        else { state.lastAnalysis = null; state.lastIsHeld = false; }
        renderReadout(state.lastAnalysis, state.lastIsHeld);
      }
      state.currentAngle += (state.targetAngle - state.currentAngle) * 0.25;
      $("needleGroup").setAttribute("transform", `rotate(${state.currentAngle.toFixed(2)} 120 126)`);
      rafId = requestAnimationFrame(tick);
    }

    async function startTuner() {
      showBanner("");
      try {
        const { sampleRate } = await session.start();
        state.sampleRate = sampleRate; smoother.reset(); state.lastAnalysis = null;
        renderStaticUI(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick);
      } catch (err) {
        const d = getDict(state.language);
        const isLocalOpaque = location.protocol === "file:" || location.protocol === "content:";
        const msg = err?.code === "INSECURE_CONTEXT" ? (isLocalOpaque ? d.errLocalFile : d.errInsecure)
          : err?.code === "UNSUPPORTED" ? d.errUnsupported
          : (err?.name === "NotAllowedError" || err?.name === "PermissionDeniedError") ? (isLocalOpaque ? d.errLocalFile : d.errPermission)
          : (err?.name === "NotFoundError" || err?.name === "DevicesNotFoundError") ? d.errNotFound : d.errUnknown;
        showBanner(msg); renderStaticUI();
      }
    }

    async function stopTuner(statusOverride = "") {
      cancelAnimationFrame(rafId); await session.stop(); smoother.reset();
      state.lastAnalysis = null; state.lastIsHeld = false; state.targetAngle = 0; state.currentAngle = 0;
      $("needleGroup").setAttribute("transform", "rotate(0 120 126)");
      renderStaticUI(); renderReadout(null, false);
      if (statusOverride) showBanner(statusOverride);
    }

    $("micBtn").addEventListener("click", () => (session.isRunning ? stopTuner() : startTuner()));
    $("langBtn").addEventListener("click", () => { state.language = state.language === "zh-CN" ? "zh-TW" : "zh-CN"; saveSettings(); renderStaticUI(); if (state.lastAnalysis) renderReadout(state.lastAnalysis, state.lastIsHeld); });
    function bindHoldRepeat(button, onStep) {
      let delayTimer = 0, repeatTimer = 0, stepCount = 0, handledByPointer = false;
      const stop = () => { clearTimeout(delayTimer); clearTimeout(repeatTimer); delayTimer = 0; repeatTimer = 0; stepCount = 0; };
      const scheduleNext = () => {
        const delta = stepCount >= 18 ? 10 : stepCount >= 8 ? 5 : 1;
        const interval = stepCount >= 18 ? 70 : stepCount >= 8 ? 75 : 90;
        repeatTimer = setTimeout(() => {
          if (button.disabled) { stop(); return; }
          stepCount += 1; onStep(delta); scheduleNext();
        }, interval);
      };
      button.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || button.disabled) return;
        handledByPointer = true; stop(); onStep(1);
        delayTimer = setTimeout(() => { if (!button.disabled) scheduleNext(); }, 380);
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach((evt) => button.addEventListener(evt, stop));
      button.addEventListener("click", () => {
        if (handledByPointer) { handledByPointer = false; return; }
        if (!button.disabled) onStep(1);
      });
    }
    const adjustA4 = (delta) => {
      const next = clamp(state.a4 + delta, A4_MIN, A4_MAX);
      if (next === state.a4) return;
      state.a4 = next; saveSettings(); renderStaticUI();
    };
    bindHoldRepeat($("a4Dec"), (step) => adjustA4(-step));
    bindHoldRepeat($("a4Inc"), (step) => adjustA4(step));
    $("a4Value").addEventListener("click", () => { state.a4 = A4_DEFAULT; saveSettings(); renderStaticUI(); });
    $("transposeDown").addEventListener("click", () => { state.transpose = clamp(state.transpose - 1, TRANSPOSE_MIN, TRANSPOSE_MAX); saveSettings(); renderStaticUI(); });
    $("transposeUp").addEventListener("click", () => { state.transpose = clamp(state.transpose + 1, TRANSPOSE_MIN, TRANSPOSE_MAX); saveSettings(); renderStaticUI(); });
    $("transposeBadge").addEventListener("click", (e) => { e.stopPropagation(); state.transpose = 0; saveSettings(); renderStaticUI(); });
    $("tuningCard").addEventListener("click", openDrawer);
    $("tuningCard").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDrawer(); } });
    $("drawerBackdrop").addEventListener("click", closeDrawer);
    $("drawerClose").addEventListener("click", closeDrawer);
    let titleTapCount = 0, titleLastTapMs = 0;
    $("appTitle").addEventListener("click", () => {
      const now = Date.now();
      if (now - titleLastTapMs > 600) titleTapCount = 0;
      titleLastTapMs = now; titleTapCount += 1;
      if (titleTapCount >= 5) { titleTapCount = 0; openAboutModal(); }
    });
    $("aboutBackdrop").addEventListener("click", closeAboutModal);
    $("aboutClose").addEventListener("click", closeAboutModal);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { if (!$("aboutModal").hidden) { closeAboutModal(); return; } if (!$("tuningDrawer").hidden) { closeDrawer(); return; } }
      if (e.code === "Space" && $("tuningDrawer").hidden && $("aboutModal").hidden && !["BUTTON","INPUT","SELECT"].includes(document.activeElement?.tagName)) {
        e.preventDefault(); session.isRunning ? stopTuner() : startTuner();
      }
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden && session.isRunning) stopTuner(getDict(state.language).pausedBackground); });
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); state.installPrompt = e; $("installBtn").hidden = false; });
    $("installBtn").addEventListener("click", async () => { if (!state.installPrompt) return; state.installPrompt.prompt(); await state.installPrompt.userChoice; state.installPrompt = null; $("installBtn").hidden = true; });

    loadSettings(); renderGaugeTicks(); renderStaticUI();
    if (!window.isSecureContext) showBanner(getDict(state.language).errInsecure);
  })();
  </script>
</body>
</html>
